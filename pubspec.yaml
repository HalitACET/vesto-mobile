name: mobile
description: Vesto AI — Dijital gardırop ve AI kombin öneri platformu.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_storage: ^13.3.0

  # State Management & Routing
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  go_router: ^17.2.3

  # UI
  google_fonts: ^8.1.0
  flutter_svg: ^2.0.10+1
  flutter_animate: ^4.5.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Auth
  google_sign_in: ^7.2.0
  shared_preferences: ^2.3.2
  geolocator: ^14.0.2

  # Hafta 4 — Kıyafet Ekleme
  image_picker: ^1.1.2
  image_cropper: ^12.2.1
  flutter_image_compress: ^2.3.0
  permission_handler: ^12.0.1
  path_provider: ^2.1.4
  uuid: ^4.5.1

  # Utils
  intl: ^0.20.2
  equatable: ^2.0.5
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  build_runner: ^2.4.12

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/mannequin/

  fonts:
    - family: Cormorant
      fonts:
        - asset: assets/fonts/static/Cormorant-Regular.ttf
        - asset: assets/fonts/static/Cormorant-Medium.ttf
          weight: 500
        - asset: assets/fonts/static/Cormorant-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/static/Cormorant-Bold.ttf
          weight: 700
        - asset: assets/fonts/static/Cormorant-Italic.ttf
          style: italic
