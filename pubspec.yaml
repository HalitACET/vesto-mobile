name: mobile
description: Vesto AI — Dijital gardırop ve AI kombin öneri platformu.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.3.0

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  flutter_animate: ^4.5.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Auth
  google_sign_in: ^6.2.1
  shared_preferences: ^2.3.2
  geolocator: ^13.0.2

  # Utils
  intl: ^0.19.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.12
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Cormorant
      fonts:
        - asset: assets/fonts/static/Cormorant-Regular.ttf
        - asset: assets/fonts/static/Cormorant-Medium.ttf
          weight: 500
        - asset: assets/fonts/static/Cormorant-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/static/Cormorant-Bold.ttf
          weight: 700
        - asset: assets/fonts/static/Cormorant-Italic.ttf
          style: italic
